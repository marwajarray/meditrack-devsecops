stages: [test, sast, secrets, deps, build, scan-image, zap-scan, push]

default:
  tags: [docker]

variables:
  GIT_DEPTH: "0"
  BACKEND_IMAGE: $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA
  FRONTEND_IMAGE: $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA

# ---------- Tests ----------
test-backend:
  stage: test
  image: node:20.20.2-alpine
  script:
    - cd backend
    - npm ci
    - npm run lint
    - npm test

test-frontend:
  stage: test
  image: node:20.20.2-alpine
  script:
    - cd frontend
    - npm ci
    - npm run lint
    - npm run build

# ---------- Contrôles de sécurité (bloquants) ----------
sast-semgrep:
  stage: sast
  image: semgrep/semgrep:1.182.1
  script:
    - semgrep scan --config p/javascript --config p/nodejs --config p/secrets --error --metrics=off backend/src frontend/src

secrets-gitleaks:
  stage: secrets
  image:
    name: ghcr.io/gitleaks/gitleaks:v8.30.1
    entrypoint: [""]
  script:
    - gitleaks git --redact --no-banner -v .

deps-trivy:
  stage: deps
  image:
    name: aquasec/trivy:0.71.2
    entrypoint: [""]
  script:
    - trivy fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 backend
    - trivy fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 frontend

# ---------- Build, scan image, push ----------
build-images:
  stage: build
  image: docker:29-cli
  script:
    - docker build --pull --no-cache -t $BACKEND_IMAGE backend
    - docker build --pull --no-cache -t $FRONTEND_IMAGE frontend

scan-image:
  stage: scan-image
  image:
    name: aquasec/trivy:0.71.2
    entrypoint: [""]
  script:
    - trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 $BACKEND_IMAGE
    - trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 $FRONTEND_IMAGE

push-images:
  stage: push
  image: docker:29-cli
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
    - docker push $BACKEND_IMAGE
    - docker push $FRONTEND_IMAGE

# ---------- Rapports Trivy (informatif, non bloquant) ----------
trivy-report:
  stage: scan-image
  image:
    name: aquasec/trivy:0.71.2
    entrypoint: [""]
  allow_failure: true
  script:
    - mkdir -p trivy-reports
    - trivy image --format template --template "@/contrib/html.tpl" -o trivy-reports/image-backend.html $BACKEND_IMAGE
    - trivy image --format template --template "@/contrib/html.tpl" -o trivy-reports/image-frontend.html $FRONTEND_IMAGE
    - trivy fs --scanners vuln --format template --template "@/contrib/html.tpl" -o trivy-reports/deps-backend.html backend
    - trivy fs --scanners vuln --format template --template "@/contrib/html.tpl" -o trivy-reports/deps-frontend.html frontend
    - trivy config --format template --template "@/contrib/html.tpl" -o trivy-reports/k8s-config.html k8s
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - trivy-reports/

# ---------- DAST : OWASP ZAP ----------
zap-baseline:
  stage: zap-scan
  tags:
    - dast-local
  image:
    name: ghcr.io/zaproxy/zaproxy:stable
    entrypoint: [""]
  allow_failure: true
  rules:
    - when: manual
  script:
    - |
      if [ -z "${DAST_TARGET_URL:-}" ]; then
        echo "ERREUR : définir la variable CI/CD DAST_TARGET_URL."
        echo "Exemple : https://staging.example.com"
        exit 1
      fi
    - mkdir -p zap-reports
    - zap-baseline.py -t "$DAST_TARGET_URL" -r zap-reports/zap-baseline.html -J zap-reports/zap-baseline.json -I
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - zap-reports/

